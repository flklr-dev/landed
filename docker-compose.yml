# ─────────────────────────────────────────────
# Landed — Local Development Services
# Usage: docker compose up -d
# ─────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: landed-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: landed
      POSTGRES_PASSWORD: landed_dev
      POSTGRES_DB: landed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landed"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: landed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
